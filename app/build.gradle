plugins {
    id 'com.android.application'
}

def releaseStoreFile = findProperty("PDFSHIELD_RELEASE_STORE_FILE")
def releaseStorePassword = findProperty("PDFSHIELD_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = findProperty("PDFSHIELD_RELEASE_KEY_ALIAS")
def releaseKeyPassword = findProperty("PDFSHIELD_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'org.ferreiratechlab.leitordepdfseguro'
    compileSdk 33
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.9.0'
            // Adicione outras dependências aqui, se necessário
        }
    }
        // ...
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        jniLibs {
            useLegacyPackaging = false
        }
    }


    defaultConfig {
        applicationId "org.ferreiratechlab.leitordepdfseguro"
        minSdk 23
        targetSdk 33
        versionCode 10
        versionName "1.5.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-runtime:2.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.9.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'org.mockito:mockito-android:4.11.0'
    implementation 'androidx.biometric:biometric:1.2.0-alpha03'
    implementation 'com.github.asadwaheed1:AndroidPdfViewer:v3.2.0-beta06'
    implementation 'androidx.security:security-crypto:1.0.0-rc03'
    implementation ('org.apache.pdfbox:pdfbox-app:2.0.24') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation 'androidx.navigation:navigation-fragment-ktx:2.4.1'
    implementation 'androidx.navigation:navigation-ui-ktx:2.4.1'
    def room_version = "2.4.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation 'androidx.core:core:1.9.0'


}
